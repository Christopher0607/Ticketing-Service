# Netlify (free plan) + Supabase. Environment variables are set in the Netlify UI or API,
# because variables declared in this file are not available to functions at runtime.
# The database is migrated automatically by the app on first use, so builds never need it.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
